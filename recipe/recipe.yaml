schema_version: 1

context:
  python_min: "3.12"
  version: "0.0.93"

package:
  name: datadepot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/datadepot/datadepot-${{ version }}.tar.gz
  sha256: e6b61fcd01d94666df0c7f13c7b9a1051d76eaf26886e3d04e991bce9ff5dea8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=2.2
    - numpy >=2.0
    - huggingface_hub >=1.29.0
    - kagglehub >=1.0.2
    - pyarrow >=23.0.1
    - ucimlrepo
    - seaborn >=0.13

tests:
  - python:
      imports:
        - datadepot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: The datadepot package provides a collection of datasets used in the book Data Science Foundations and Machine Learning with Python.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/vanraak/datadepot

extra:
  recipe-maintainers:
    - vanraak
